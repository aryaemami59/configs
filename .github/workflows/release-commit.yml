name: Release Commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  release:
    name: Release Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - name: Setup Node
        uses: ./.github/actions/prepare
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn run build

      - name: Publish
        id: publish
        run: >
          yarn run --binaries-only --top-level pkg-pr-new publish
          ./packages/eslint
          ./packages/prettier
          ./packages/typescript
          ./packages/vitest
          --yarn --packageManager="npm,yarn,pnpm,bun" --commentWithDev --commentWithSha

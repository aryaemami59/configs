name: Publish Package to npmjs
on:
  # keeping it purely manual for now as to not accidentally trigger a release
  #release:
  #  types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package'
        options:
          - '@aryaemami59/eslint-config'
          - '@aryaemami59/prettier-config'
          - '@aryaemami59/tsconfig'
          - '@aryaemami59/vitest-config'
        required: true
        type: choice
      tag:
        default: 'latest'
        description: 'NPM dist-tag (latest, alpha, beta, next)'
        options:
          - alpha
          - beta
          - latest
          - next
        required: true
        type: choice

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'yarn'
          check-latest: true
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install
      - run: yarn workspaces foreach --all --no-private --jobs unlimited run build
      - run: yarn workspace ${{ inputs.package }} exec npm publish --access public --provenance --tag ${{ inputs.tag }}
